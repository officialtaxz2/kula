# Kula is deliberately bound to the host loopback interface.
# The existing systemd-managed Caddy proxies HTTPS traffic to it.
# setup.sh builds the image from this repository by default and sets
# KULA_IMAGE; KULA_SOURCE=image runs a published c0m4r/kula release instead
# (see README.md).
name: kula-monitor
services:
  kula:
    # Without KULA_IMAGE a manual compose run builds and runs this checkout
    # under a local name, never under the upstream tag.
    image: ${KULA_IMAGE:-kula-monitor:local}
    build:
      context: ..
      dockerfile: addons/docker/Dockerfile
    container_name: kula-monitor
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      KULA_LISTEN: "127.0.0.1"
      KULA_PORT: "27960"
      KULA_DIRECTORY: "/app/data"
      KULA_MOUNTS_DETECTION: "host"
    volumes:
      - /proc:/proc:ro
      - kula_data:/app/data

volumes:
  kula_data:
    name: kula-monitor-data
